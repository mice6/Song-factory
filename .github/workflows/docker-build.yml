# Buduje obraz poza RunPodem i wypycha do GitHub Container Registry.
# Obejscie zawieszonej kolejki buildow RunPoda: endpoint mozna wtedy
# podpiac pod gotowy obraz zamiast pod repo.
name: build-and-push

on:
  push:
    branches: [minimal-test]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Obraz CUDA + torch nie miesci sie na domyslnym dysku runnera
      # (~14 GB wolnego). Kasowanie preinstalowanych toolchainow zwalnia 25-30 GB.
      - name: Zwolnij miejsce na dysku runnera
        run: |
          echo "--- przed czyszczeniem ---"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost
          sudo docker image prune --all --force
          echo "--- po czyszczeniu ---"
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # UWAGA: nazwa obrazu w GHCR musi byc lowercase, a repo nazywa sie
      # "Song-factory" - stad zapisane na sztywno malymi literami.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/mice6/song-factory:minimal-test
            ghcr.io/mice6/song-factory:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
